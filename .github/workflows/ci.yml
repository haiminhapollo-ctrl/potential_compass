# Kiem tra tu dong moi lan push / mo PR (bao cao Data Science loi 14):
# typecheck + lint + kiem thu logic & tinh chat cua bo cham diem (scripts/check-logic.ts).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:logic
